<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PocketCard</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: rgba(37, 99, 235, 0.15);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f4f5f7;
    color: #111827;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 { font-size: 16px; font-weight: 800; }
  .badge {
    font-size: 11px;
    background: #eff6ff;
    color: #2563eb;
    padding: 3px 8px;
    border-radius: 99px;
    font-weight: 700;
  }
  .header-btns {
    display: flex;
    gap: 6px;
  }
  .sm-btn {
    border: 1px solid #d1d5db;
    background: #ffffff;
    color: #111827;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .sm-btn.primary {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
  }

  .container {
    padding: 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  .box {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .hidden { display: none !important; }

  select, input, textarea {
    font-size: 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 10px;
    background: #ffffff;
    color: #111827;
    width: 100%;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: #2563eb;
    color: #ffffff;
    text-align: center;
  }
  .btn:active { opacity: 0.75; }
  .btn-sub { background: #e5e7eb; color: #111827; }

  /* 絞り込み */
  .filter-bar {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .filter-grid label {
    display: block;
    font-size: 11px;
    color: #6b7280;
    margin-bottom: 3px;
  }

  /* カード */
  .flashcard {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 28px 18px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .card-meta {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 14px;
  }
  .star-color { color: #eab308; font-weight: 700; }
  .card-q {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.5;
    word-break: break-word;
  }
  .card-a {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed #d1d5db;
    font-size: 19px;
    color: #2563eb;
    font-weight: 700;
    line-height: 1.5;
    width: 100%;
    word-break: break-word;
  }

  .rate-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .rate-grid .btn { padding: 16px 4px; font-size: 15px; }
  .btn-again { background: #fee2e2; color: #dc2626; }
  .btn-hard { background: #fef3c7; color: #d97706; }
  .btn-good { background: #dcfce7; color: #16a34a; }

  .msg-ok {
    margin-top: 8px;
    padding: 10px;
    border-radius: 8px;
    background: #dcfce7;
    color: #16a34a;
    font-size: 14px;
    font-weight: 700;
  }

  .item {
    border-bottom: 1px solid #e5e7eb;
    padding: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .item:last-child { border-bottom: none; }
  .item-text { flex: 1; min-width: 0; }
  .item-q { font-size: 14px; font-weight: 700; }
  .item-a { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .del-btn {
    background: #fee2e2;
    color: #dc2626;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>PocketCard</h1>
    <span class="badge" id="stat-badge">0/0</span>
  </div>
  <div class="header-btns">
    <button type="button" class="sm-btn" id="btn-open-list">一覧・同期</button>
    <button type="button" class="sm-btn primary" id="btn-open-add">＋ 問題追加</button>
  </div>
</header>

<div class="container">

  <!-- 問題追加パネル（ボタンを押すと開く） -->
  <div class="box hidden" id="panel-add">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <strong style="font-size:15px;">テキストから一括登録</strong>
      <button type="button" class="sm-btn" id="btn-close-add">閉じる ✕</button>
    </div>
    <textarea id="bulk-input" rows="5" placeholder="例：問題 / 答え / 江戸時代 / プリント3 / ★★★"></textarea>
    <p style="font-size:11px; color:#6b7280; margin:6px 0 10px;">
      時代・プリント番号・カッコ内の★の数を自動で読み取ります
    </p>
    <button type="button" class="btn" id="btn-submit-add">この内容で登録する</button>
    <div id="add-msg" class="msg-ok hidden"></div>
  </div>

  <!-- 一覧・同期パネル（ボタンを押すと開く） -->
  <div class="box hidden" id="panel-list">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <strong style="font-size:15px;" id="list-title">登録一覧・データ同期</strong>
      <button type="button" class="sm-btn" id="btn-close-list">閉じる ✕</button>
    </div>

    <div style="margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid #e5e7eb;">
      <button type="button" class="btn btn-sub" id="btn-export" style="margin-bottom:8px;">同期コードをコピー</button>
      <textarea id="sync-box" rows="3" placeholder="同期コードを貼り付けて読み込み"></textarea>
      <button type="button" class="btn" id="btn-import" style="margin-top:8px;">同期コードを読み込む</button>
    </div>

    <input type="text" id="list-search" placeholder="問題・答え・時代・プリントNo.で検索..." style="margin-bottom:8px;">
    <div id="card-list"></div>
    <button type="button" class="btn btn-sub hidden" id="btn-more" style="margin-top:8px;">さらに30件表示</button>
  </div>

  <!-- 絞り込みバー -->
  <div class="filter-bar" id="filter-toggle">
    <span id="filter-summary">すべて出題 · シャッフル</span>
    <span style="color:#2563eb;" id="filter-toggle-text">絞り込み ▼</span>
  </div>

  <!-- 絞り込み設定パネル -->
  <div class="box hidden" id="filter-panel">
    <div class="filter-grid">
      <div>
        <label>習得状況</label>
        <select id="f-status">
          <option value="all">すべて</option>
          <option value="not_mastered">習得済み以外</option>
          <option value="unlearned">未学習のみ</option>
          <option value="again">もう一度のみ</option>
          <option value="hard">不安のみ</option>
          <option value="mastered">習得済みのみ</option>
        </select>
      </div>
      <div>
        <label>重要度（★の数）</label>
        <select id="f-star">
          <option value="all">すべて</option>
          <option value="3">★★★ のみ</option>
          <option value="2plus">★★ 以上</option>
          <option value="1plus">★ 以上</option>
          <option value="2">★★ のみ</option>
          <option value="1">★ のみ</option>
          <option value="0">星なし（0）のみ</option>
        </select>
      </div>
      <div>
        <label>時代・タグ</label>
        <select id="f-tag">
          <option value="all">すべて</option>
        </select>
      </div>
      <div>
        <label>プリント番号</label>
        <select id="f-print">
          <option value="all">すべて</option>
        </select>
      </div>
      <div>
        <label>出題数</label>
        <select id="f-limit">
          <option value="0">全問出題</option>
          <option value="10">10問まで</option>
          <option value="20">20問まで</option>
          <option value="30">30問まで</option>
        </select>
      </div>
      <div>
        <label>出題順</label>
        <select id="f-order">
          <option value="shuffle">シャッフル</option>
          <option value="star_desc">重要度が高い順</option>
          <option value="seq">登録順</option>
        </select>
      </div>
    </div>
  </div>

  <!-- フラッシュカード本体 -->
  <div class="flashcard" id="card-box">
    <div class="card-meta" id="card-meta">準備完了</div>
    <div class="card-q" id="card-q">右上の「＋ 問題追加」を押して問題を登録してください</div>
    <div class="card-a hidden" id="card-a"></div>
  </div>

  <!-- 回答操作ボタン -->
  <button type="button" class="btn" id="btn-show">答えを見る</button>
  <div class="rate-grid hidden" id="rate-btns">
    <button type="button" class="btn btn-again" id="btn-again">❌ もう一度</button>
    <button type="button" class="btn btn-hard" id="btn-hard">🔺 不安</button>
    <button type="button" class="btn btn-good" id="btn-mastered">⭕️ 習得</button>
  </div>

</div>

<script>
(function() {
  const STORAGE_KEY = 'pocketcard_data_v1';
  let cards = [];
  let queue = [];
  let currentIndex = 0;
  let isRevealed = false;
  let listLimit = 30;

  const ERA_LIST = [
    '旧石器', '縄文', '弥生', '古墳', '飛鳥', '奈良', '平安',
    '鎌倉', '南北朝', '室町', '戦国', '安土桃山', '織豊',
    '江戸', '幕末', '明治', '大正', '昭和', '平成', '令和',
    '原始', '古代', '中世', '近世', '近代', '現代'
  ];

  function toHalf(str) {
    return String(str || '').replace(/[０-９Ａ-Ｚａ-ｚ]/g, function(s) {
      return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    });
  }

  function normPrint(val) {
    if (val === undefined || val === null) return '';
    return toHalf(val).replace(/^(no\.?|print|プリント|プリ)\s*/i, '').trim();
  }

  function extractStars(text) {
    const re = /[\(（]\s*([★☆]+|[0０])\s*[\)）]/;
    const m = text.match(re);
    if (m) {
      const count = (m[1].match(/★/g) || []).length;
      const cleaned = text.replace(re, ' ').replace(/\s+/g, ' ').trim();
      return { stars: count, found: true, cleaned: cleaned };
    }
    return { stars: 0, found: false, cleaned: text.trim() };
  }

  function extractPrint(text) {
    const half = toHalf(text);
    const re = /[\[\(【（#]?\s*(?:プリント\s*(?:no\.?)?|プリ\s*|no\.?|print\s*|p\.\s*)\s*([0-9]+(?:-[0-9]+)?)\s*[\]\)】）]?/i;
    const m = half.match(re);
    if (m) {
      const origRe = /[\[\(【（#]?\s*(?:プリント\s*(?:[nNｎＮ][oOｏＯ]\.?)?|プリ\s*|[nNｎＮ][oOｏＯ]\.?|[pPｐＰ][rRｒＲ][iIｉＩ][nNｎＮ][tTｔＴ]\s*|[pPｐＰ]\.\s*)\s*[0-9０-９]+(?:-[0-9０-９]+)?\s*[\]\)】）]?/;
      const cleaned = text.replace(origRe, ' ').replace(/\s+/g, ' ').trim();
      return { printNo: m[1], cleaned: cleaned };
    }
    return { printNo: '', cleaned: text.trim() };
  }

  function extractEra(text) {
    const eraPattern = new RegExp('([\\[\\(【（#]?)\\s*(' + ERA_LIST.join('|') + ')(?:時代|期|初期|中期|後期|末期)?\\s*([\\]\\)】）]?)');
    const m = text.match(eraPattern);
    if (m) {
      const base = m[2];
      const eraName = /^(原始|古代|中世|近世|近代|現代)$/.test(base) ? base : base + '時代';
      let cleaned = text;
      if (m[1] || m[3] || text.trim() === m[0].trim()) {
        cleaned = text.replace(m[0], ' ').replace(/\s+/g, ' ').trim();
      }
      return { era: eraName, cleaned: cleaned };
    }
    return { era: '', cleaned: text.trim() };
  }

  function starLabel(count) {
    const n = Number(count) || 0;
    return n > 0 ? '★'.repeat(n) : '';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    } catch (e) {}
    updateBadge();
  }

  function updateBadge() {
    const mastered = cards.filter(function(c) { return c.status === 'mastered'; }).length;
    document.getElementById('stat-badge').textContent = '習得 ' + mastered + '/' + cards.length;
  }

  function updateFilterOptions() {
    const tagSel = document.getElementById('f-tag');
    const printSel = document.getElementById('f-print');
    const curTag = tagSel.value;
    const curPrint = printSel.value;

    const tags = Array.from(new Set(cards.map(function(c) { return c.tag || c.era; }).filter(Boolean)));
    tags.sort(function(a, b) {
      const ia = ERA_LIST.findIndex(function(e) { return a.startsWith(e); });
      const ib = ERA_LIST.findIndex(function(e) { return b.startsWith(e); });
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b, 'ja');
    });

    const prints = Array.from(new Set(cards.map(function(c) { return normPrint(c.printNo); }).filter(Boolean)))
      .sort(function(a, b) { return a.localeCompare(b, 'ja', { numeric: true }); });

    tagSel.innerHTML = '<option value="all">すべて</option>' +
      tags.map(function(t) { return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>'; }).join('');
    printSel.innerHTML = '<option value="all">すべて</option>' +
      prints.map(function(p) { return '<option value="' + escapeHtml(p) + '">No.' + escapeHtml(p) + '</option>'; }).join('');

    if (tags.includes(curTag)) tagSel.value = curTag;
    if (prints.includes(curPrint)) printSel.value = curPrint;
  }

  function resetSession() {
    const st = document.getElementById('f-status').value;
    const sr = document.getElementById('f-star').value;
    const tg = document.getElementById('f-tag').value;
    const pr = document.getElementById('f-print').value;
    const lim = parseInt(document.getElementById('f-limit').value, 10);
    const ord = document.getElementById('f-order').value;

    let filtered = cards.filter(function(c) {
      const s = c.status || 'unlearned';
      const stars = Number(c.stars) || 0;
      if (st === 'not_mastered' && s === 'mastered') return false;
      if (st !== 'all' && st !== 'not_mastered' && s !== st) return false;
      if (sr === '3' && stars < 3) return false;
      if (sr === '2plus' && stars < 2) return false;
      if (sr === '1plus' && stars < 1) return false;
      if (sr === '2' && stars !== 2) return false;
      if (sr === '1' && stars !== 1) return false;
      if (sr === '0' && stars !== 0) return false;
      if (tg !== 'all' && (c.tag || c.era) !== tg) return false;
      if (pr !== 'all' && normPrint(c.printNo) !== pr) return false;
      return true;
    });

    if (ord === 'shuffle') {
      for (let i = filtered.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = filtered[i];
        filtered[i] = filtered[j];
        filtered[j] = tmp;
      }
    } else if (ord === 'star_desc') {
      filtered = filtered.slice().sort(function(a, b) { return (Number(b.stars) || 0) - (Number(a.stars) || 0); });
    } else {
      filtered = filtered.slice().reverse();
    }

    if (lim > 0 && filtered.length > lim) {
      filtered = filtered.slice(0, lim);
    }

    queue = filtered;
    currentIndex = 0;

    const stText = document.getElementById('f-status').selectedOptions[0].text;
    const parts = [stText];
    if (sr !== 'all') parts.push(document.getElementById('f-star').selectedOptions[0].text);
    if (tg !== 'all') parts.push(tg);
    if (pr !== 'all') parts.push('No.' + pr);
    parts.push(queue.length + '問');
    document.getElementById('filter-summary').textContent = parts.join(' · ');

    updateBadge();
    renderCard();
  }

  function renderCard() {
    const qEl = document.getElementById('card-q');
    const aEl = document.getElementById('card-a');
    const mEl = document.getElementById('card-meta');
    const showBtn = document.getElementById('btn-show');
    const rateBtns = document.getElementById('rate-btns');

    isRevealed = false;
    aEl.classList.add('hidden');
    rateBtns.classList.add('hidden');

    if (queue.length === 0) {
      mEl.textContent = '完了';
      qEl.textContent = cards.length === 0 ? '右上の「＋ 問題追加」を押して問題を登録してください' : '条件に合う問題はすべて終了しました！';
      showBtn.classList.add('hidden');
      return;
    }

    const c = queue[currentIndex];
    const statusMap = { unlearned: '未学習', again: 'もう一度', hard: '不安', mastered: '習得済み' };
    const meta = [(currentIndex + 1) + '/' + queue.length + '問', statusMap[c.status || 'unlearned']];
    if (c.tag || c.era) meta.push(escapeHtml(c.tag || c.era));
    if (c.printNo) meta.push('No.' + escapeHtml(c.printNo));
    const sl = starLabel(c.stars);
    if (sl) meta.push('<span class="star-color">' + sl + '</span>');

    mEl.innerHTML = meta.join(' · ');
    qEl.textContent = c.q;
    aEl.textContent = c.a;
    showBtn.classList.remove('hidden');
  }

  function revealAnswer() {
    if (queue.length === 0 || isRevealed) return;
    isRevealed = true;
    document.getElementById('card-a').classList.remove('hidden');
    document.getElementById('btn-show').classList.add('hidden');
    document.getElementById('rate-btns').classList.remove('hidden');
  }

  function rateCard(status) {
    if (queue.length === 0) return;
    const target = queue[currentIndex];
    const idx = cards.findIndex(function(c) { return c.id === target.id; });
    if (idx !== -1) {
      cards[idx].status = status;
      save();
    }
    if (status === 'again') {
      queue.push(target);
    }
    currentIndex++;
    if (currentIndex >= queue.length) {
      queue = [];
    }
    renderCard();
  }

  function splitLineSmart(line) {
    let parts = line.split(/\t|\s*[\/／|｜→⇒=＝]\s*|\s*[:：]\s*/).map(function(s) { return s.trim(); }).filter(Boolean);
    if (parts.length >= 2) return parts;

    const qMark = line.match(/^(.+?[？?])\s*(.+)$/);
    if (qMark && qMark[2].trim()) {
      return [qMark[1].trim(), qMark[2].trim()];
    }

    const spaceParts = line.split(/ +|\s{2,}/).map(function(s) { return s.trim(); }).filter(Boolean);
    if (spaceParts.length >= 2) return spaceParts;

    return [line];
  }

  function addCards() {
    const text = document.getElementById('bulk-input').value.trim();
    if (!text) {
      alert('枠内に問題と答えを入力してからボタンを押してください。');
      return;
    }

    const lines = text.split(/\r?\n/);
    let currentSectionPrint = '';
    let currentSectionTag = '';
    let pendingQ = null;
    let added = 0;

    function registerItem(rawQ, rawA, extraTokens) {
      let q = rawQ.replace(/^(?:Q[0-9０-９]*|問[0-9０-９]*)[.．:：\s]*/i, '').trim();
      let a = rawA.replace(/^(?:A[0-9０-９]*|答[0-9０-９]*)[.．:：\s]*/i, '').trim();
      let printNo = '';
      let tag = '';
      let stars = 0;
      let starFound = false;

      for (let i = 0; i < extraTokens.length; i++) {
        let token = extraTokens[i];
        const extS = extractStars(token);
        if (extS.found) {
          stars = extS.stars;
          starFound = true;
          token = extS.cleaned;
        } else if (/^[★☆]+$/.test(token)) {
          stars = (token.match(/★/g) || []).length;
          starFound = true;
          continue;
        }
        const extP = extractPrint(token);
        if (extP.printNo) {
          printNo = extP.printNo;
          token = extP.cleaned;
        }
        if (/^[0-9０-９]+(-[0-9０-９]+)?$/.test(token)) {
          printNo = toHalf(token);
          continue;
        }
        if (token) {
          const extE = extractEra(token);
          if (extE.era) {
            tag = extE.era;
          } else if (!tag) {
            tag = token;
          }
        }
      }

      if (!starFound) {
        const starFromA = extractStars(a);
        if (starFromA.found) { stars = starFromA.stars; starFound = true; a = starFromA.cleaned; }
      }
      if (!starFound) {
        const starFromQ = extractStars(q);
        if (starFromQ.found) { stars = starFromQ.stars; starFound = true; q = starFromQ.cleaned; }
      }
      if (!printNo) {
        const fromA = extractPrint(a);
        if (fromA.printNo) { printNo = fromA.printNo; a = fromA.cleaned; }
      }
      if (!printNo) {
        const fromQ = extractPrint(q);
        if (fromQ.printNo) { printNo = fromQ.printNo; q = fromQ.cleaned; }
      }
      if (!tag) {
        const eraFromA = extractEra(a);
        if (eraFromA.era) { tag = eraFromA.era; a = eraFromA.cleaned; }
      }
      if (!tag) {
        const eraFromQ = extractEra(q);
        if (eraFromQ.era) { tag = eraFromQ.era; q = eraFromQ.cleaned; }
      }

      if (!printNo && currentSectionPrint) printNo = currentSectionPrint;
      if (!tag && currentSectionTag) tag = currentSectionTag;

      if (q && a) {
        cards.unshift({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          q: q, a: a, tag: tag, printNo: printNo, stars: stars, status: 'unlearned'
        });
        added++;
      }
    }

    lines.forEach(function(rawLine) {
      const line = rawLine.trim();
      if (!line) return;

      if (pendingQ !== null && /^(?:A|答|答え|解答)[.．:：\s]/i.test(line)) {
        const ansParts = splitLineSmart(line);
        registerItem(pendingQ, ansParts[0], ansParts.slice(1));
        pendingQ = null;
        return;
      }

      if (/^(?:Q[0-9０-９]*|問[0-9０-９]*)[.．:：\s]/i.test(line)) {
        const qParts = splitLineSmart(line);
        if (qParts.length >= 2) {
          registerItem(qParts[0], qParts[1], qParts.slice(2));
          pendingQ = null;
        } else {
          pendingQ = line;
        }
        return;
      }

      const parts = splitLineSmart(line);
      if (parts.length < 2) {
        const extP = extractPrint(line);
        if (extP.printNo) currentSectionPrint = extP.printNo;
        const extE = extractEra(extP.cleaned);
        if (extE.era) {
          currentSectionTag = extE.era;
        } else {
          const cleanHeader = extE.cleaned.replace(/^[\[\(【（#\-=\s]+|[\]\)】）#\-=\s]+$/g, '').trim();
          if (cleanHeader && cleanHeader.length <= 25) {
            currentSectionTag = cleanHeader;
          }
        }
        return;
      }

      pendingQ = null;
      registerItem(parts[0], parts[1], parts.slice(2));
    });

    const msgEl = document.getElementById('add-msg');
    if (added > 0) {
      save();
      updateFilterOptions();
      resetSession();
      document.getElementById('bulk-input').value = '';
      msgEl.textContent = '✅ ' + added + '問を追加しました！';
      msgEl.classList.remove('hidden');
      setTimeout(function() { msgEl.classList.add('hidden'); }, 4000);
    } else {
      alert('問題と答えの区切りが見つかりませんでした。\n「問題 / 答え」のように区切りを入れて入力してください。');
    }
  }

  function renderList() {
    const listEl = document.getElementById('card-list');
    const kw = (document.getElementById('list-search').value || '').trim().toLowerCase();
    document.getElementById('list-title').textContent = '登録一覧（全' + cards.length + '問）';

    const filtered = kw
      ? cards.filter(function(c) {
          return c.q.toLowerCase().includes(kw) ||
            c.a.toLowerCase().includes(kw) ||
            (c.tag || '').toLowerCase().includes(kw) ||
            (c.printNo || '').toLowerCase().includes(kw);
        })
      : cards;

    const slice = filtered.slice(0, listLimit);
    listEl.innerHTML = slice.map(function(c) {
      const tags = [c.tag || c.era, c.printNo ? 'No.' + c.printNo : '', starLabel(c.stars)].filter(Boolean).join(' / ');
      return '<div class="item">' +
        '<div class="item-text">' +
          '<div class="item-q">' + escapeHtml(c.q) + '</div>' +
          '<div class="item-a">' + escapeHtml(c.a) + (tags ? ' [' + escapeHtml(tags) + ']' : '') + '</div>' +
        '</div>' +
        '<button type="button" class="del-btn" data-id="' + c.id + '">削除</button>' +
      '</div>';
    }).join('');

    const moreBtn = document.getElementById('btn-more');
    if (filtered.length > listLimit) {
      moreBtn.classList.remove('hidden');
      moreBtn.textContent = 'さらに30件表示（残り ' + (filtered.length - listLimit) + '件）';
    } else {
      moreBtn.classList.add('hidden');
    }
  }

  // イベント登録（すべてaddEventListenerで確実にバインド）
  document.getElementById('btn-open-add').addEventListener('click', function() {
    document.getElementById('panel-list').classList.add('hidden');
    document.getElementById('panel-add').classList.toggle('hidden');
  });
  document.getElementById('btn-close-add').addEventListener('click', function() {
    document.getElementById('panel-add').classList.add('hidden');
  });

  document.getElementById('btn-open-list').addEventListener('click', function() {
    document.getElementById('panel-add').classList.add('hidden');
    const panel = document.getElementById('panel-list');
    const isHidden = panel.classList.toggle('hidden');
    if (!isHidden) {
      listLimit = 30;
      renderList();
    }
  });
  document.getElementById('btn-close-list').addEventListener('click', function() {
    document.getElementById('panel-list').classList.add('hidden');
  });

  document.getElementById('btn-submit-add').addEventListener('click', addCards);

  document.getElementById('filter-toggle').addEventListener('click', function() {
    const isHidden = document.getElementById('filter-panel').classList.toggle('hidden');
    document.getElementById('filter-toggle-text').textContent = isHidden ? '絞り込み ▼' : '閉じる ▲';
  });

  ['f-status', 'f-star', 'f-tag', 'f-print', 'f-limit', 'f-order'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', resetSession);
  });

  document.getElementById('card-box').addEventListener('click', revealAnswer);
  document.getElementById('btn-show').addEventListener('click', revealAnswer);
  document.getElementById('btn-again').addEventListener('click', function() { rateCard('again'); });
  document.getElementById('btn-hard').addEventListener('click', function() { rateCard('hard'); });
  document.getElementById('btn-mastered').addEventListener('click', function() { rateCard('mastered'); });

  document.getElementById('list-search').addEventListener('input', renderList);
  document.getElementById('btn-more').addEventListener('click', function() {
    listLimit += 30;
    renderList();
  });

  document.getElementById('card-list').addEventListener('click', function(e) {
    if (e.target && e.target.classList.contains('del-btn')) {
      const id = e.target.getAttribute('data-id');
      cards = cards.filter(function(c) { return c.id !== id; });
      save();
      updateFilterOptions();
      resetSession();
      renderList();
    }
  });

  document.getElementById('btn-export').addEventListener('click', function() {
    const code = JSON.stringify(cards);
    document.getElementById('sync-box').value = code;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(function() { alert('同期コードをコピーしました！'); });
    } else {
      alert('下の枠内のテキストをすべてコピーしてください');
    }
  });

  document.getElementById('btn-import').addEventListener('click', function() {
    try {
      const raw = document.getElementById('sync-box').value.trim();
      if (!raw) return;
      const parsed = JSON.parse(raw);
      const imported = Array.isArray(parsed) ? parsed : (parsed.cards || []);
      if (!Array.isArray(imported)) throw new Error();
      cards = imported.map(function(c) {
        let p = normPrint(c.printNo ?? c.print ?? c.printNumber ?? '');
        let t = c.tag || c.era || '';
        let s = typeof c.stars === 'number' ? c.stars : 0;
        if (!t) {
          const fromQ = extractEra(c.q || c.question || '');
          if (fromQ.era) t = fromQ.era;
        }
        return {
          id: c.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          q: c.q || c.question || '',
          a: c.a || c.answer || '',
          tag: t,
          printNo: p,
          stars: s,
          status: c.status || 'unlearned'
        };
      });
      save();
      updateFilterOptions();
      resetSession();
      renderList();
      alert(cards.length + '問のデータを読み込みました！');
    } catch (e) {
      alert('同期コードの形式が正しくありません');
    }
  });

  // 初期読み込み
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const list = Array.isArray(parsed) ? parsed : (parsed.cards || []);
      cards = list.map(function(c) {
        let p = normPrint(c.printNo ?? c.print ?? c.printNumber ?? '');
        let t = c.tag || c.era || '';
        let s = typeof c.stars === 'number' ? c.stars : 0;
        if (!p) {
          const fromTag = extractPrint(t);
          if (fromTag.printNo) p = fromTag.printNo;
        }
        if (!t) {
          const fromQ = extractEra(c.q || '');
          if (fromQ.era) t = fromQ.era;
        }
        return Object.assign({}, c, { printNo: p, tag: t, stars: s });
      });
    }
  } catch (e) { cards = []; }

  updateFilterOptions();
  resetSession();
})();
</script>
</body>
</html>
