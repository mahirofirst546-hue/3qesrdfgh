<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PocketCard</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: rgba(37, 99, 235, 0.15);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f4f5f7;
    color: #111827;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 { font-size: 16px; font-weight: 800; }
  .badge {
    font-size: 11px;
    background: #eff6ff;
    color: #2563eb;
    padding: 3px 8px;
    border-radius: 99px;
    font-weight: 700;
  }
  .header-btns {
    display: flex;
    gap: 6px;
  }
  .sm-btn {
    border: 1px solid #d1d5db;
    background: #ffffff;
    color: #111827;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .sm-btn.primary {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
  }

  .container {
    padding: 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  .box {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .hidden { display: none !important; }

  select, input, textarea {
    font-size: 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 10px;
    background: #ffffff;
    color: #111827;
    width: 100%;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: #2563eb;
    color: #ffffff;
    text-align: center;
  }
  .btn:active { opacity: 0.75; }
  .btn-sub { background: #e5e7eb; color: #111827; }

  /* 絞り込み */
  .filter-bar {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .filter-grid label {
    display: block;
    font-size: 11px;
    color: #6b7280;
    margin-bottom: 3px;
  }

  /* カード */
  .flashcard {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 28px 18px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .card-meta {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 14px;
  }
  .star-color { color: #eab308; font-weight: 700; }
  .card-q {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .card-a {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed #d1d5db;
    font-size: 19px;
    color: #2563eb;
    font-weight: 700;
    line-height: 1.6;
    width: 100%;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .rate-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .rate-grid .btn { padding: 16px 4px; font-size: 15px; }
  .btn-again { background: #fee2e2; color: #dc2626; }
  .btn-hard { background: #fef3c7; color: #d97706; }
  .btn-good { background: #dcfce7; color: #16a34a; }

  .msg-ok {
    margin-top: 8px;
    padding: 10px;
    border-radius: 8px;
    background: #dcfce7;
    color: #16a34a;
    font-size: 14px;
    font-weight: 700;
  }

  .item {
    border-bottom: 1px solid #e5e7eb;
    padding: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .item:last-child { border-bottom: none; }
  .item-text { flex: 1; min-width: 0; }
  .item-q { font-size: 14px; font-weight: 700; }
  .item-a { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .del-btn {
    background: #fee2e2;
    color: #dc2626;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>PocketCard</h1>
    <span class="badge" id="stat-badge">0/0</span>
  </div>
  <div class="header-btns">
    <button type="button" class="sm-btn" id="btn-open-list">一覧・同期</button>
    <button type="button" class="sm-btn primary" id="btn-open-add">＋ 問題追加</button>
  </div>
</header>

<div class="container">

  <!-- 問題追加パネル -->
  <div class="box hidden" id="panel-add">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <strong style="font-size:15px;">テキストから一括登録</strong>
      <button type="button" class="sm-btn" id="btn-close-add">閉じる ✕</button>
    </div>
    <textarea id="bulk-input" rows="6" placeholder="（穴抜きになっている文）：（穴抜き箇所の解答）&#10;※1文に穴が2つ以上ある問題もそのまま対応します"></textarea>
    <p style="font-size:11px; color:#6b7280; margin:6px 0 10px;">
      形式：「穴抜き文：解答」を1行ずつ入力（時代・プリント番号・（★の数）を自動判定）
    </p>
    <button type="button" class="btn" id="btn-submit-add">この内容で登録する</button>
    <div id="add-msg" class="msg-ok hidden"></div>
  </div>

  <!-- 一覧・同期パネル -->
  <div class="box hidden" id="panel-list">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <strong style="font-size:15px;" id="list-title">登録一覧・データ同期</strong>
      <button type="button" class="sm-btn" id="btn-close-list">閉じる ✕</button>
    </div>

    <div style="margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid #e5e7eb;">
      <button type="button" class="btn btn-sub" id="btn-export" style="margin-bottom:8px;">同期コードをコピー</button>
      <textarea id="sync-box" rows="3" placeholder="同期コードを貼り付けて読み込み"></textarea>
      <button type="button" class="btn" id="btn-import" style="margin-top:8px;">同期コードを読み込む</button>
    </div>

    <input type="text" id="list-search" placeholder="問題・答え・時代・プリントNo.で検索..." style="margin-bottom:8px;">
    <div id="card-list"></div>
    <button type="button" class="btn btn-sub hidden" id="btn-more" style="margin-top:8px;">さらに30件表示</button>
  </div>

  <!-- 絞り込みバー -->
  <div class="filter-bar" id="filter-toggle">
    <span id="filter-summary">すべて出題 · シャッフル</span>
    <span style="color:#2563eb;" id="filter-toggle-text">絞り込み ▼</span>
  </div>

  <!-- 絞り込み設定パネル -->
